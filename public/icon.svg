<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo Esmeralda Oscuro & Azul Zafiro Ejecutivo (Cero Rosado) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="52%" stop-color="#0F3D3E" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Brillo ambiental superior -->
    <radialGradient id="glowTop" cx="25%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0B192C" stop-opacity="0" />
    </radialGradient>

    <!-- Tarjeta financiera superior (Verde Menta / Esmeralda) -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cuerpo de la Billetera (Azul Marino Profundo / Pizarra) -->
    <linearGradient id="walletBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Broche / Moneda Dorada -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Solapa del broche en Azul Marino -->
    <linearGradient id="claspGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.42" />
    </filter>
  </defs>

  <!-- Fondo con esquinas redondeadas estilo iOS/macOS -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="116" fill="url(#glowTop)" />
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="#5EEAD4" stroke-opacity="0.18" stroke-width="3" />

  <!-- Tarjeta de crecimiento que asoma de la billetera -->
  <g filter="url(#softShadow)">
    <rect x="122" y="102" width="256" height="140" rx="28" transform="rotate(-6 250 172)" fill="url(#cardGrad)" />
    <!-- Chip dorado de la tarjeta -->
    <rect x="152" y="128" width="44" height="32" rx="8" transform="rotate(-6 174 144)" fill="url(#goldGrad)" />
    <!-- Línea de tendencia ascendente en la tarjeta -->
    <path d="M225 162 L258 138 L284 150 L328 114" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" />
    <circle cx="328" cy="114" r="6" fill="#FDE68A" />
  </g>

  <!-- Cuerpo principal de la billetera -->
  <g filter="url(#softShadow)">
    <rect x="88" y="168" width="336" height="236" rx="44" fill="url(#walletBody)" />
    <!-- Costura superior decorativa -->
    <path d="M124 204 H388" stroke="#94A3B8" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.55" />

    <!-- Barras de riqueza ascendentes a la izquierda -->
    <rect x="132" y="314" width="22" height="46" rx="8" fill="#0D9488" opacity="0.55" />
    <rect x="164" y="290" width="22" height="70" rx="8" fill="#0D9488" opacity="0.8" />
    <rect x="196" y="260" width="22" height="100" rx="8" fill="#059669" />

    <!-- Solapa derecha de la billetera -->
    <rect x="296" y="244" width="144" height="92" rx="28" fill="url(#claspGrad)" />
  </g>

  <!-- Moneda Dorada con símbolo $ en el broche -->
  <g filter="url(#softShadow)">
    <circle cx="348" cy="290" r="34" fill="url(#goldGrad)" />
    <circle cx="348" cy="290" r="27" fill="none" stroke="#FEF3C7" stroke-opacity="0.6" stroke-width="2.5" />
    <text x="348" y="303" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#78350F">$</text>
  </g>

  <!-- Destello superior derecho -->
  <path d="M404 96 L410 114 L428 120 L410 126 L404 144 L398 126 L380 120 L398 114 Z" fill="#FDE68A" opacity="0.9" />
</svg>
